[project]
name = "dotctl"
version = "0.1.0"
description = "Yet another dotfiles manager powered by YAML and JINJA2"
readme = "README.md"
authors = [{ name = "aurora0x27", email = "qingfengzl0831@163.com" }]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=15.0.0",
]

[project.scripts]
dotctl = "dotctl:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
indent-width = 4
exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
